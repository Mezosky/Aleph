        robots_policy:
          respect_robots: true
          robots_url: https://www.t13.cl/robots.txt
          crawl_allowed: true
          user_agent: Aleph/0.1 (+https://github.com/Mezosky/Aleph)
          notes: Homepage allowed; no machine-readable general news feed was declared.
