  # -------------------------------------------------------------------------
  # XX — TEMPLATE, NOT A COUNTRY
  #
  # `XX` is an ISO 3166-1 user-assigned code, permanently reserved and never a
  # real state; the hosts are `.example`, reserved by RFC 2606 and guaranteed not
  # to resolve. This block exists to prove that Aleph is jurisdiction-parameterised
  # rather than built around one country: adding a jurisdiction is adding a block
  # here, and requires no change to any Python module, schema or frontend
  # component. Copy it, replace the code, name and addresses, and the same
  # filtering, clustering, independence and ranking code applies unchanged.
  #
  # The institutional roles below are the ones every analysis wants first,
  # regardless of country: who makes the law, where the law is published, who
  # costs it, who measures the economy, and who reports on all of it.
  # -------------------------------------------------------------------------
  XX:
    jurisdiction:
      code: XX
      name: Example Jurisdiction (template, not a real country)
      level: national
    defaults:
      language: en
      enabled: false          # a template must never be retrieved from
      verified: false
      feeds: []
      paywall: unknown
      added_at: "2026-08-07"
      robots_policy:
        respect_robots: true
        crawl_allowed: null

    sources:
      - id: src:xx-legislature
        name: National Legislature (template)
        kind: legislature
        base_url: https://legislature.example/
        evidence_tier: legislative_record
        typical_independence: original_reporting
        topics: [legislation, legislative_procedure]
        notes: >-
          Whoever formally records introduction, debate, amendment and votes.

      - id: src:xx-official-journal
        name: Official Journal (template)
        kind: government_body
        base_url: https://gazette.example/
        evidence_tier: primary_document
        typical_independence: original_reporting
        topics: [official_gazette, promulgation]
        notes: >-
          Whoever publishes the authoritative text of an instrument as enacted.

      - id: src:xx-budget-office
        name: Budget Office (template)
        kind: government_body
        base_url: https://budget.example/
        evidence_tier: official_technical_report
        typical_independence: original_reporting
        topics: [public_finance, budget, costing]

      - id: src:xx-statistics-agency
        name: National Statistics Agency (template)
        kind: statistics_agency
        base_url: https://statistics.example/
        evidence_tier: statistical_dataset
        typical_independence: original_reporting
        topics: [statistics, labour, prices, population]

      - id: src:xx-central-bank
        name: Central Bank (template)
        kind: government_body
        base_url: https://centralbank.example/
        evidence_tier: statistical_dataset
        typical_independence: original_reporting
        topics: [monetary_policy, national_accounts]

      - id: src:xx-audit-office
        name: Audit Office (template — address unknown)
        # Demonstrates the honest-gap mechanism: a body known to exist and to be
        # relevant, whose address this file does not claim to know. The loader
        # reports it as unresolved and it is never retrieved from. Copying a
        # plausible-looking URL here instead would produce a source that silently
        # returns nothing while appearing to have been consulted.
        base_url: null
        kind: government_body
        evidence_tier: official_technical_report
        typical_independence: original_reporting
        topics: [audit, public_administration]

      - id: src:xx-news-national
        name: National Daily (template)
        kind: news_outlet
        base_url: https://daily.example/
        evidence_tier: journalism
        typical_independence: unknown
        topics: [news, politics, economy]

      - id: src:xx-news-wire
        name: News Agency (template)
        kind: news_outlet
        base_url: https://agency.example/
        evidence_tier: journalism
        typical_independence: original_reporting
        topics: [news, wire]
        notes: >-
          A wire service originates copy that many outlets republish verbatim.
          Recording it here is what lets the independence analysis collapse forty
          republications back to the one observation they all are.

      - id: src:xx-news-aggregator
        name: News Aggregator (template)
        kind: aggregator
        base_url: https://aggregator.example/
        evidence_tier: journalism
        typical_independence: aggregated
        topics: [news]
        notes: >-
          Contributes coverage volume and no independent observation whatsoever.

      - id: src:xx-research-institute
        name: Research Institute (template)
        kind: academic
        base_url: https://research.example/
        evidence_tier: peer_reviewed
        typical_independence: original_reporting
        topics: [economics, public_policy]
        notes: >-
          Tier peer_reviewed describes the artefact class — work that passed
          external review — not the institution's standing. Non-reviewed output
          from the same body is expert_analysis and must be recorded as such.

      - id: src:xx-civil-society
        name: Civil Society Organisation (template)
        kind: ngo
        base_url: https://civilsociety.example/
        evidence_tier: expert_analysis
        typical_independence: original_reporting
        topics: [public_policy, advocacy]
        ownership_note: >-
          Factual, public-record disclosure of funding or ownership goes here so
          a reader can weigh a possible interest for themselves. Aleph never
          converts this string into a score and never lets it move a verdict.
