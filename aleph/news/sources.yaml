# Aleph source registry
# ---------------------------------------------------------------------------
# WHAT THIS FILE IS
#
# A description of sources Aleph may retrieve from: what kind of body publishes
# each one, in what jurisdiction and language, at what address, and under what
# crawl rules. It answers "what is this thing and how do we reach it".
#
# WHAT THIS FILE IS NOT
#
# It is NOT an assessment of how much any source should be believed. There is no
# credibility score, no bias rating, no political-leaning field and no prestige
# weight anywhere in this file, in `source_registry.json`, or in the loader — and
# `aleph/news/registry.py` rejects the file outright if one appears, rather than
# ignoring it. That absence is the design. A numeric trust weight attached to an
# outlet would let institutional standing substitute for evidence and would
# quietly turn every downstream verdict into a judgement about who was speaking.
#
# Two fields do describe evidential structure, and neither is a merit ranking:
#   * `evidence_tier`        - what KIND of artefact this source produces, and
#                              therefore what it can and cannot establish. A
#                              legislature settles what was formally recorded,
#                              not whether a projection will hold.
#   * `typical_independence` - whether the source usually originates its own
#                              material or republishes others'. It exists so that
#                              ten outlets carrying one wire story are counted as
#                              one observation rather than ten corroborations.
#
# HONESTY RULES OBSERVED HERE
#
#   * `verified: true` appears only on entries checked against the live web, with
#     an explicit `last_verified_at`. `verified` is an authoring key: the loader
#     never invents a timestamp.
#   * Feed URLs are recorded only when declared by the publisher or its
#     robots.txt. Sources without a confirmed machine endpoint keep `feeds: []`.
#   * `base_url: null` where the address is not known with confidence. The loader
#     records such an entry as UNRESOLVED and excludes it from retrieval instead
#     of guessing a URL. Guessing would produce a plausible-looking source that
#     silently returns nothing, which is worse than a declared gap.
#   * `paywall: unknown` and `crawl_allowed: null` throughout. "Unknown" is not
#     the same as "none" and not the same as "permitted"; only a live check may
#     change either, and no live check has been run.
#
# STRUCTURE
#
# Entries are grouped under `jurisdictions:` purely for authoring convenience.
# Each block supplies `jurisdiction` and `defaults` that are merged into every
# entry beneath it (an entry always wins over the default). The loader flattens
# this into the schema-native flat `sources:` list, so the grouping is ergonomics,
# not a second data model. A flat `sources:` list is also accepted.
#
# Nothing in Aleph's library code branches on a jurisdiction key. Adding a country
# means adding a block here; it never means editing Python. The `XX` block below
# exists to demonstrate exactly that, using RFC 2606 `.example` domains that are
# reserved for documentation and resolve nowhere.
# ---------------------------------------------------------------------------

schema_version: "1.0.0"
registry_version: "2026-08-07.1"

notes: >-
  Source registry with explicitly timestamped verification state. Entries not
  marked verified remain declarations of intent and are excluded from live
  retrieval. A verified homepage without a confirmed machine-readable feed is
  likewise not polled by the acquisition workflow.

# Conservative fallback politeness budget for entries that state none of their
# own. A registry entry that gets Aleph blocked removes a source from every
# future analysis, so the defaults are slow on purpose.
default_rate_limit:
  requests_per_minute: 10
  min_interval_seconds: 6
  max_concurrent: 1
  backoff_seconds: 60
  daily_request_cap: 500

jurisdictions:

  # -------------------------------------------------------------------------
  # CL
  #
  # Institutional entries name only bodies whose existence and address this
  # build is confident of. Where confidence was absent, `base_url` is null and
  # the entry is flagged for verification rather than filled in with a guess.
  # -------------------------------------------------------------------------
  CL:
    jurisdiction:
      code: CL
      name: Chile
      level: national
    defaults:
      language: es-CL
      enabled: true
      verified: false
      feeds: []
      paywall: unknown
      added_at: "2026-08-07"
      robots_policy:
        respect_robots: true
        crawl_allowed: null
        notes: >-
          Not yet checked. Null means unchecked, which is not the same as
          permitted; the fetcher must treat it as "do not crawl until checked".

    sources:

      # --- institutions: legislature ---------------------------------------
      - id: src:cl-camara-diputados
        name: Cámara de Diputadas y Diputados
        kind: legislature
        base_url: https://www.camara.cl/
        evidence_tier: legislative_record
        typical_independence: original_reporting
        topics: [legislation, legislative_procedure, committee_reports]
        notes: >-
          Lower chamber of the national legislature. Establishes what was
          formally introduced, debated, amended and voted; establishes nothing
          about whether a projection in a bill will hold.

      - id: src:cl-senado
        name: Senado de la República
        kind: legislature
        base_url: https://www.senado.cl/
        evidence_tier: legislative_record
        typical_independence: original_reporting
        topics: [legislation, legislative_procedure, committee_reports]

      - id: src:cl-bcn
        name: Biblioteca del Congreso Nacional
        kind: legislature
        base_url: https://www.bcn.cl/
        evidence_tier: primary_document
        typical_independence: original_reporting
        topics: [legislation, consolidated_law, legislative_history]
        notes: >-
          Publishes consolidated statutory texts and legislative histories. Tier
          is primary_document because the artefact retrieved is the text of an
          instrument itself, not a report about it.

      # --- institutions: official journal ----------------------------------
      - id: src:cl-diario-oficial
        name: Diario Oficial de la República de Chile
        kind: government_body
        base_url: https://www.diariooficial.interior.gob.cl/
        evidence_tier: primary_document
        typical_independence: original_reporting
        topics: [official_gazette, promulgation, regulation]
        notes: >-
          Official journal of record. Establishes that a text was promulgated on
          a given date in a given form; establishes nothing about its effects.

      # --- institutions: actor-profile official records -------------------
      - id: src:cl-infoprobidad
        name: InfoProbidad
        kind: government_body
        base_url: https://www.infoprobidad.cl/
        evidence_tier: primary_document
        typical_independence: original_reporting
        topics: [declarations_of_interest, asset_declarations, public_integrity]
        notes: >-
          Official public portal operated by the Consejo para la Transparencia
          and Contraloría for declarations of interests and assets. Retrieved
          declarations may populate actor profiles only in the attributed stage;
          they are never evidence for or against a claim's factual verdict.

      - id: src:cl-poder-judicial
        name: Poder Judicial de Chile
        kind: government_body
        base_url: https://www.pjud.cl/
        evidence_tier: primary_document
        typical_independence: original_reporting
        topics: [judicial_records, court_decisions, case_status]
        notes: >-
          Entry point for the official case consultation, document-verification
          and unified judgments services. A legal-record item requires a direct
          primary-record URL and explicit procedural status; this registry entry
          alone is never sufficient to create one.

      # --- institutions: budget office -------------------------------------
      - id: src:cl-budget-office
        name: Dirección de Presupuestos
        kind: government_body
        base_url: https://www.dipres.gob.cl/
        evidence_tier: official_technical_report
        typical_independence: original_reporting
        topics: [public_finance, budget, fiscal_reports, financial_reports]
        notes: >-
          National budget office. Its financial reports establish what the
          executive's own costing assumed and projected — which is a fact about
          the projection, never a fact about the outcome.

      # --- institutions: statistics ----------------------------------------
      - id: src:cl-ine
        name: Instituto Nacional de Estadísticas
        kind: statistics_agency
        base_url: https://www.ine.gob.cl/
        evidence_tier: statistical_dataset
        typical_independence: original_reporting
        topics: [statistics, labour, prices, population, housing]
        notes: >-
          National statistics institute. Establishes measured quantities within
          the stated methodology and reference period, and nothing outside them.

      # --- institutions: central bank --------------------------------------
      - id: src:cl-banco-central
        name: Banco Central de Chile
        kind: government_body
        base_url: https://www.bcentral.cl/
        evidence_tier: statistical_dataset
        typical_independence: original_reporting
        topics: [monetary_policy, national_accounts, statistics, exchange_rates]
        notes: >-
          Central bank. Tier reflects the artefact Aleph most often retrieves —
          the published statistical series. Its policy reports are
          official_technical_report material and should be recorded as separate
          evidence items when used as such.

      # --- institutions: address not confidently known ---------------------
      - id: src:cl-audit-office
        name: Contraloría General de la República
        # NEEDS VERIFICATION. This build is not confident which host serves the
        # national audit office's public site, so no URL is written. The entry is
        # kept because the BODY is a known and relevant source of official
        # technical reports; scripts/verify_sources.py must resolve and write the
        # address before anything can be retrieved from it. Until then the loader
        # reports this as unresolved and no retrieval is attempted.
        base_url: null
        kind: government_body
        evidence_tier: official_technical_report
        typical_independence: original_reporting
        enabled: false
        topics: [audit, public_administration, legality_review]

      # --- news outlets -----------------------------------------------------
      #
      # Listed because they exist and publish in scope, which is a fact about
      # coverage. Listing is not endorsement and carries no weight: nothing
      # downstream may rank an item because of which of these carried it.
      # `typical_independence: unknown` until measured — Aleph derives real
      # independence per story in aleph/news/independence.py, from the text,
      # rather than assuming it from the masthead.
      - id: src:cl-adnradio
        name: ADN Radio
        kind: news_outlet
        base_url: https://www.adnradio.cl/
        verified: true
        last_verified_at: "2026-08-07T12:30:00Z"
        robots_policy:
          respect_robots: true
          robots_url: https://www.adnradio.cl/robots.txt
          crawl_allowed: true
          user_agent: Aleph/0.1 (+https://github.com/Mezosky/Aleph)
          notes: Homepage allowed; no general news feed was declared in its HTML or robots file.
        evidence_tier: journalism
        typical_independence: unknown
        topics: [news, politics, economy]

      - id: src:cl-biobiochile
        name: BioBioChile
        kind: news_outlet
        base_url: https://www.biobiochile.cl/
        verified: true
        last_verified_at: "2026-08-07T12:30:00Z"
        feeds:
          - url: https://feeds.feedburner.com/radiobiobio/NNeJ
            format: rss
            label: General news feed declared by the publisher
        robots_policy:
          respect_robots: true
          robots_url: https://www.biobiochile.cl/robots.txt
          crawl_allowed: true
          user_agent: Aleph/0.1 (+https://github.com/Mezosky/Aleph)
        evidence_tier: journalism
        typical_independence: unknown
        topics: [news, politics, economy, regional]

      - id: src:cl-cooperativa
        name: Cooperativa
        kind: news_outlet
        base_url: https://www.cooperativa.cl/
        verified: true
        last_verified_at: "2026-08-07T12:30:00Z"
        feeds:
          - url: https://www.cooperativa.cl/noticias/google_news_rss.xml
            format: rss
            label: News feed declared in robots.txt
        robots_policy:
          respect_robots: true
          robots_url: https://www.cooperativa.cl/robots.txt
          crawl_allowed: true
          user_agent: Aleph/0.1 (+https://github.com/Mezosky/Aleph)
        evidence_tier: journalism
        typical_independence: unknown
        topics: [news, politics, economy]

      - id: src:cl-latercera
        name: La Tercera
        kind: news_outlet
        base_url: https://www.latercera.com/
        verified: true
        last_verified_at: "2026-08-07T12:30:00Z"
        feeds:
          - url: https://www.latercera.com/arc/outboundfeeds/sitemap/?outputType=xml
            format: sitemap
            label: Sitemap declared in robots.txt
        robots_policy:
          respect_robots: true
          robots_url: https://www.latercera.com/robots.txt
          crawl_allowed: true
          user_agent: Aleph/0.1 (+https://github.com/Mezosky/Aleph)
        evidence_tier: journalism
        typical_independence: unknown
        topics: [news, politics, economy, business]

      - id: src:cl-ciper
        name: CIPER Chile
        kind: news_outlet
        base_url: https://www.ciperchile.cl/
        verified: true
        last_verified_at: "2026-08-07T12:30:00Z"
        feeds:
          - url: https://www.ciperchile.cl/feed/
            format: rss
            label: General news feed declared by the publisher
        robots_policy:
          respect_robots: true
          robots_url: https://www.ciperchile.cl/robots.txt
          crawl_allowed: true
          user_agent: Aleph/0.1 (+https://github.com/Mezosky/Aleph)
        evidence_tier: journalism
        typical_independence: unknown
        topics: [investigative, public_administration, long_form]
        notes: >-
          Investigative and long-form. Tier remains journalism: the amount of
          work behind a piece is not a tier, and Aleph must not promote an
          artefact class because a source is held in high regard. What the extra
          work produces — quoted primary documents, named datasets — is picked up
          per item by primary_source_grounding, where it belongs.

      - id: src:cl-elpais-chile
        name: El País (Chile)
        kind: news_outlet
        base_url: https://elpais.com/chile/actualidad/
        verified: true
        last_verified_at: "2026-08-07T12:30:00Z"
        feeds:
          - url: https://feeds.elpais.com/mrss-s/list/ep/site/elpais.com/section/chile/subsection/actualidad
            format: rss
            label: Chile actualidad feed declared by the publisher
        robots_policy:
          respect_robots: true
          robots_url: https://elpais.com/robots.txt
          crawl_allowed: true
          user_agent: Aleph/0.1 (+https://github.com/Mezosky/Aleph)
        evidence_tier: journalism
        typical_independence: unknown
        language: es-ES
        additional_languages: [es-CL]
        topics: [news, politics, economy]
        notes: >-
          Section of an international outlet. Language differs from the block
          default, which matters for near-duplicate detection: a translated
          syndication is still a syndication.

      - id: src:cl-cnnchile
        name: CNN Chile
        kind: news_outlet
        base_url: https://www.cnnchile.com/
        verified: true
