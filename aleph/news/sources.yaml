        feeds:
          - url: https://www.cnnchile.com/_files/sitemaps/sitemap_news.xml
            format: sitemap
            label: News sitemap declared in robots.txt
        robots_policy:
          respect_robots: true
          robots_url: https://www.cnnchile.com/robots.txt
          crawl_allowed: true
          user_agent: Aleph/0.1 (+https://github.com/Mezosky/Aleph)
        evidence_tier: journalism
        typical_independence: unknown
        topics: [news, politics, economy, broadcast]

      - id: src:cl-meganoticias
        name: Meganoticias
        kind: news_outlet
        base_url: https://www.meganoticias.cl/
        verified: true
        last_verified_at: "2026-08-07T12:30:00Z"
        feeds:
          - url: https://www.meganoticias.cl/sitemaps/sitemap-news.xml
            format: sitemap
            label: News sitemap declared in robots.txt
        robots_policy:
          respect_robots: true
          robots_url: https://www.meganoticias.cl/robots.txt
