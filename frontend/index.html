<!doctype html>
<html lang="es" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aleph — Entiende la evidencia detrás del debate público</title>
    <meta
      name="description"
      content="Aleph analiza documentos públicos, extrae afirmaciones, las contrasta con la fuente primaria y muestra cómo distintos medios enmarcan el mismo hecho."
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Leading-slash paths are rewritten to the configured base (/Aleph/) at
         build time, so these resolve correctly on GitHub Pages' sub-path. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aleph — Entiende la evidencia detrás del debate público" />
    <meta
      property="og:description"
      content="Aleph analiza documentos públicos, extrae afirmaciones, las contrasta con la fuente primaria y muestra cómo distintos medios enmarcan el mismo hecho."
    />
    <meta property="og:image" content="https://mezosky.github.io/Aleph/logo-512.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong background. An explicit user choice wins; otherwise follow the OS.
      ;(function () {
        try {
          var stored = localStorage.getItem('aleph-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* localStorage unavailable (private mode) — fall back to light. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
