<!doctype html>
<html lang="es" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aleph — Entiende la evidencia detrás del debate público</title>
    <meta
      name="description"
      content="Aleph analiza documentos públicos, extrae afirmaciones, las contrasta con la fuente primaria y muestra cómo distintos medios enmarcan el mismo hecho."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' x='4' font-size='26' font-family='serif'%3E%D7%90%3C/text%3E%3C/svg%3E" />
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong background. An explicit user choice wins; otherwise follow the OS.
      ;(function () {
        try {
          var stored = localStorage.getItem('aleph-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* localStorage unavailable (private mode) — fall back to light. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
