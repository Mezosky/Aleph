[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aleph"
version = "0.1.0"
description = "Evidence-analysis engine for public-policy documents: extracts propositions, collects evidence, and evaluates factual claims blind to speaker identity."
requires-python = ">=3.11"
keywords = ["evidence", "fact-checking", "policy-analysis", "nlp", "provenance"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]

# Runtime dependencies. Deliberately small: everything Aleph needs to read a document,
# model it, talk to an HTTP LLM/search endpoint, and read registry config.
dependencies = [
  "pydantic>=2.6",
  "pypdf>=4.2",
  "pymupdf>=1.24",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Serving layer. Kept optional so the pipeline and the schema tooling can be installed
# (in CI, in a batch job) without pulling a web framework.
api = [
  "alembic>=1.14",
  "fastapi>=0.110",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]
# Developer / CI tooling. jsonschema lives here because schema validation is a check,
# not a runtime capability.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "jsonschema>=4.21",
]
# Explicit offline-publication acquisition. Browser binaries are installed
# separately by Playwright and never enter the repository or deployed site.
acquisition = [
  "playwright>=1.62",
]

[project.urls]
Homepage = "https://mezosky.github.io/Aleph/"
Source = "https://github.com/Mezosky/Aleph"

[tool.setuptools]
# `api` is intentionally NOT packaged: it is an application entrypoint imported from the
# working directory (`uvicorn api.main:app`), not a library other code depends on.
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["aleph*"]
namespaces = false

[tool.setuptools.package-data]
aleph = ["py.typed", "**/*.json", "**/*.yaml", "**/*.yml"]

# ---------------------------------------------------------------------------
# Ruff: one tool for lint + format, so "style" never becomes a review argument.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv",
  ".toolchain",
  "frontend",
  "data",
  "build",
  "dist",
  # Ruff will reformat Python inside Markdown fences. Documentation snippets are
  # written to be read, not to satisfy a formatter, and a prose file must never
  # be able to fail the build.
  "*.md",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes: undefined names, unused imports
  "I",   # isort: deterministic import order
  "UP",  # pyupgrade: keeps us on 3.11+ typing (X | None, not Optional)
  "B",   # flake8-bugbear: real bug shapes, e.g. mutable defaults
  "C4",  # flake8-comprehensions
]
ignore = [
  # The formatter owns line length; E501 would only fire on things it cannot split
  # (long URLs, long literal source passages quoted verbatim in fixtures).
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is a function call in a default argument.
"api/**" = ["B008"]
# Tests may shadow builtins in fixtures and assert on unused bindings.
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["aleph", "api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "slow: test that takes more than a second",
  "network: test that requires network access (skipped by default in CI)",
]
filterwarnings = [
  "error::DeprecationWarning:aleph.*",
]
