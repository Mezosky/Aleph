# Aleph — local development stack.
#
#   docker compose up                      API + Vite dev server
#   docker compose --profile pipeline run --rm pipeline
#                                          one-shot refresh of the static payload
#
# Secrets are never written here. Values come from a local .env (see .env.example),
# which is git-ignored; the file is optional so a clone with no credentials still
# boots against the deterministic mock LLM provider.

name: aleph

services:
  # -------------------------------------------------------------------------
  # postgres — durable, append-only analysis history
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ALEPH_POSTGRES_DB:-aleph}
      POSTGRES_USER: ${ALEPH_POSTGRES_USER:-aleph}
      POSTGRES_PASSWORD: ${ALEPH_POSTGRES_PASSWORD:-aleph-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALEPH_POSTGRES_USER:-aleph} -d ${ALEPH_POSTGRES_DB:-aleph}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # vllm — optional fully local Qwen3.5 inference on the Blackwell GPU
  #
  # First launch downloads the pinned checkpoint. Set HF_HUB_OFFLINE=1 on all
  # later launches to make accidental network access impossible.
  # -------------------------------------------------------------------------
  vllm:
    image: nvcr.io/nvidia/vllm:26.07-py3
    profiles: ["local-llm"]
    gpus: all
    ipc: host
    shm_size: 16gb
    environment:
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      VLLM_USE_FLASHINFER_SAMPLER: ${VLLM_USE_FLASHINFER_SAMPLER:-0}
    volumes:
      - model_cache:/models/huggingface
    ports:
      - "8001:8000"
    command:
      - vllm
      - serve
      - nvidia/Qwen3.5-122B-A10B-NVFP4
      - --revision
      - 98915d837c4e7c87ac8296d02e89de19b3207e6d
      - --served-model-name
      - nvidia/Qwen3.5-122B-A10B-NVFP4
      - --trust-remote-code
      - --quantization
      - modelopt_fp4
      - --kv-cache-dtype
      - fp8
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.90"
      - --enforce-eager
      - --attention-backend
      - TRITON_ATTN
      - --reasoning-parser
      - qwen3
      - --language-model-only
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # api — FastAPI service, reloaded from the mounted source tree
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      target: api
    image: aleph-api:dev
    env_file:
      - path: .env
        required: false
    environment:
      # "mock" is a real, deterministic provider — the stack is fully usable
      # with no credentials at all.
      ALEPH_LLM_PROVIDER: ${ALEPH_LLM_PROVIDER:-mock}
      ALEPH_QWEN_BASE_URL: ${ALEPH_QWEN_BASE_URL:-http://vllm:8000/v1}
      ALEPH_QWEN_API_KEY: ${ALEPH_QWEN_API_KEY:-}
      ALEPH_QWEN_MODEL: ${ALEPH_QWEN_MODEL:-nvidia/Qwen3.5-122B-A10B-NVFP4}
      ALEPH_QWEN_REVISION: ${ALEPH_QWEN_REVISION:-98915d837c4e7c87ac8296d02e89de19b3207e6d}
      ALEPH_DATABASE_URL: postgresql+psycopg://${ALEPH_POSTGRES_USER:-aleph}:${ALEPH_POSTGRES_PASSWORD:-aleph-local-only}@postgres:5432/${ALEPH_POSTGRES_DB:-aleph}
      ALEPH_CORS_ORIGINS: ${ALEPH_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ALEPH_DATA_DIR: ${ALEPH_DATA_DIR:-/app/data}
      ALEPH_SCHEMA_DIR: /app/schemas
      ALEPH_LOG_LEVEL: ${ALEPH_LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    volumes:
      # Read-write: the pipeline writes here.
      - ./data:/app/data
      # Read-only source mounts so --reload picks up edits without rebuilding.
      - ./aleph:/app/aleph:ro
      - ./api:/app/api:ro
      - ./schemas:/app/schemas:ro
      - ./scripts:/app/scripts:ro
      - api_cache:/app/.cache
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn api.main:app --host 0.0.0.0 --port 8000
        --reload --reload-dir /app/aleph --reload-dir /app/api
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # frontend — Vite dev server
  # -------------------------------------------------------------------------
  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      # This URL is resolved by the BROWSER, not by the container, so it must be
      # the host-published port and never the compose service name.
      VITE_ALEPH_API_URL: ${VITE_ALEPH_API_URL:-http://localhost:8000}
      # Dev server serves from the root; only the Pages build uses /Aleph/.
      VITE_BASE: ${VITE_BASE:-/}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous-named volume keeps container node_modules from colliding with
      # host-installed ones built for a different platform.
      - frontend_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - >-
        if [ -f package-lock.json ]; then npm ci; else npm install; fi &&
        npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # pipeline — one-shot refresh job (profile-gated, does not start with `up`)
  # -------------------------------------------------------------------------
  pipeline:
    build:
      context: .
      target: api
    image: aleph-api:dev
    profiles: ["pipeline"]
    env_file:
      - path: .env
        required: false
    environment:
      ALEPH_LLM_PROVIDER: ${ALEPH_LLM_PROVIDER:-mock}
      ALEPH_QWEN_BASE_URL: ${ALEPH_QWEN_BASE_URL:-http://vllm:8000/v1}
      ALEPH_QWEN_API_KEY: ${ALEPH_QWEN_API_KEY:-}
      ALEPH_QWEN_MODEL: ${ALEPH_QWEN_MODEL:-nvidia/Qwen3.5-122B-A10B-NVFP4}
      ALEPH_QWEN_REVISION: ${ALEPH_QWEN_REVISION:-98915d837c4e7c87ac8296d02e89de19b3207e6d}
      ALEPH_DATABASE_URL: postgresql+psycopg://${ALEPH_POSTGRES_USER:-aleph}:${ALEPH_POSTGRES_PASSWORD:-aleph-local-only}@postgres:5432/${ALEPH_POSTGRES_DB:-aleph}
      ALEPH_DATA_DIR: ${ALEPH_DATA_DIR:-/app/data}
      ALEPH_SCHEMA_DIR: /app/schemas
      ALEPH_STATIC_OUT_DIR: /app/frontend/public/data
    volumes:
      - ./data:/app/data
      - ./aleph:/app/aleph:ro
      - ./schemas:/app/schemas:ro
      - ./scripts:/app/scripts:ro
      # Writable: this is the job's product — the static payload the site serves.
      - ./frontend/public/data:/app/frontend/public/data
      - api_cache:/app/.cache
    entrypoint: ["python", "scripts/refresh.py"]
    command: []
    restart: "no"

volumes:
  frontend_node_modules:
  api_cache:
  model_cache:
  postgres_data:
