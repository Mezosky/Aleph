name: Refresh analysis data

# Re-runs the Aleph pipeline and commits the regenerated static payload.
#
# Two deliberate constraints:
#   1. Only files under frontend/public/data/ are committed. The job must never
#      be able to modify library code, schemas, or workflows.
#   2. Commits carry [skip ci], so a data refresh cannot trigger a deploy that
#      triggers another refresh.

on:
  schedule:
    # Three times a day, off the hour to avoid the top-of-hour scheduling queue.
    - cron: "17 5,13,21 * * *"
  workflow_dispatch:
    inputs:
      analysis:
        description: "Analysis slug to refresh (blank = every analysis in the registry)"
        required: false
        type: string
        default: ""
      force:
        description: "Rebuild even when upstream sources look unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Serialise refreshes: two concurrent runs would race on the same commit.
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate static payload
    # Forks inherit the schedule but have neither the credentials nor the write
    # target for it. Without this guard every fork would fail nightly.
    if: github.repository == 'Mezosky/Aleph'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # A shallow clone cannot rebase onto concurrent pushes.
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run refresh pipeline
        env:
          # Inputs are attacker-controllable text. They are passed through the
          # environment and quoted, never interpolated into the shell command.
          # Deliberately outside the ALEPH_* namespace so they cannot be mistaken
          # for library configuration by aleph.core.config.
          REFRESH_ANALYSIS: ${{ inputs.analysis }}
          REFRESH_FORCE: ${{ inputs.force }}
          ALEPH_LLM_PROVIDER: ${{ vars.ALEPH_LLM_PROVIDER || 'mock' }}
          ALEPH_QWEN_BASE_URL: ${{ vars.ALEPH_QWEN_BASE_URL }}
          ALEPH_QWEN_API_KEY: ${{ secrets.ALEPH_QWEN_API_KEY }}
          ALEPH_QWEN_MODEL: ${{ vars.ALEPH_QWEN_MODEL }}
          ALEPH_SEARCH_PROVIDER: ${{ vars.ALEPH_SEARCH_PROVIDER || 'mock' }}
          ALEPH_SEARCH_BASE_URL: ${{ vars.ALEPH_SEARCH_BASE_URL }}
          ALEPH_SEARCH_API_KEY: ${{ secrets.ALEPH_SEARCH_API_KEY }}
          ALEPH_STATIC_OUT_DIR: frontend/public/data
        run: |
          set -euo pipefail
          args=()
          if [ -n "${REFRESH_ANALYSIS}" ]; then
            args+=(--analysis "${REFRESH_ANALYSIS}")
          fi
          if [ "${REFRESH_FORCE}" = "true" ]; then
            args+=(--force)
          fi
          echo "Running: scripts/refresh.py ${args[*]-}"
          python scripts/refresh.py ${args[@]+"${args[@]}"}

      - name: Validate regenerated payload
        run: python scripts/validate_data.py

      - name: Commit changed static data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Scope the stage to the payload directory. Anything the pipeline
          # touched elsewhere is discarded rather than committed.
          git add -- frontend/public/data

          if git diff --cached --quiet; then
            echo "No changes to the static payload; nothing to commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          # [skip ci] stops this commit from re-triggering CI and pages.yml,
          # which would otherwise loop with the schedule.
          git commit -m "chore(data): refresh static analysis payload [skip ci]"

          # Rebase onto anything pushed while the pipeline was running.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          {
            echo "### Aleph data refresh"
            echo ""
            echo "- analysis: \`${ANALYSIS:-<all>}\`"
            echo "- force: \`${FORCE:-false}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ANALYSIS: ${{ inputs.analysis }}
          FORCE: ${{ inputs.force }}
